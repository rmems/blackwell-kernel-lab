# CPU CI — GitHub-hosted (no GPU). Kernel CMake skip path only.
name: ci-cpu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernels-cpu-configure:
    name: Kernel CMake configure (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 pinned
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Kernels CMake skip path (no CUDA)
        run: |
          test -f kernels/README.md
          test -f kernels/CMakeLists.txt
          test -f kernels/src/device_hello.cu
          test -f kernels/src/graph_launch_bench.cu
          test -f recipes/l1-prefix-kv-reuse.md
          cmake -S kernels -B build/kernels-cpu -DBKL_ENABLE_CUDA=OFF
          # No GPU targets required; configure must succeed without nvcc.
