# CPU CI — GitHub-hosted (no GPU). Kernel CMake skip path only.
name: ci-cpu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernels-cpu-configure:
    name: Kernel CMake configure (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 pinned
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Kernel tree is complete
        # Derived from the build and doc files rather than hand-listed. The
        # previous hand-kept list was not updated when green_ctx_bench.cu and
        # the L2 recipe landed in #35, so the newest kernel in the tree fell
        # outside this gate without anything failing.
        run: |
          status=0

          test -f kernels/README.md
          test -f kernels/CMakeLists.txt
          test -f kernels/src/CMakeLists.txt

          # Every executable declared in the kernel tree must have its source.
          mapfile -t sources < <(
            sed -n 's/^add_executable([A-Za-z0-9_]\+ \([A-Za-z0-9_.-]\+\))$/\1/p' \
              kernels/src/CMakeLists.txt
          )
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "parsed no add_executable() sources from kernels/src/CMakeLists.txt"
            exit 1
          fi
          for source in "${sources[@]}"; do
            if [ -f "kernels/src/$source" ]; then
              echo "ok       kernels/src/$source"
            else
              echo "MISSING  kernels/src/$source"
              status=1
            fi
          done

          # Every recipe kernels/README.md sends people to must exist.
          mapfile -t recipes < <(
            grep -oE '\(\.\./recipes/[A-Za-z0-9._-]+\.md\)' kernels/README.md |
              tr -d '()' | sed 's|^\.\./||' | sort -u
          )
          if [ "${#recipes[@]}" -eq 0 ]; then
            echo "parsed no recipe links from kernels/README.md"
            exit 1
          fi
          for recipe in "${recipes[@]}"; do
            if [ -f "$recipe" ]; then
              echo "ok       $recipe"
            else
              echo "MISSING  $recipe"
              status=1
            fi
          done

          exit "$status"

      - name: Kernels CMake skip path (no CUDA)
        run: |
          cmake -S kernels -B build/kernels-cpu -DBKL_ENABLE_CUDA=OFF
          # No GPU targets required; configure must succeed without nvcc.

      - name: F0 correlation schema join (CPU)
        # Issue #52: join Agoge-marker + BKL-sample fixtures. No GPU.
        run: |
          python3 tools/check_f0_correlation.py \
            --markers fixtures/f0-correlation/agoge-markers.jsonl \
            --samples fixtures/f0-correlation/bkl-gpu-samples.jsonl

      - name: F0 efficiency formulas (CPU)
        # Issue #55: derive tokens/s, step-time, VRAM/headroom, approximate energy.
        run: |
          python3 tools/check_f0_efficiency.py
          python3 tools/summarize_f0_efficiency.py \
            --markers fixtures/f0-correlation/agoge-markers.jsonl \
            --samples fixtures/f0-correlation/bkl-gpu-samples.jsonl \
            --profile-windows fixtures/f0-efficiency/profile-windows.jsonl \
            --train-fit-ref fixtures/f0-efficiency/train-fit-reference.json \
            --print-json >/tmp/f0-efficiency.json
          python3 -m json.tool /tmp/f0-efficiency.json >/dev/null
