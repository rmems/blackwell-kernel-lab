# CPU CI — GitHub-hosted (no GPU). Syntax + synthetic harness only.
name: ci-cpu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-cpu:
    name: Synthetic harness (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4 pinned
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        # actions/setup-python@v5 pinned
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile harness
        run: |
          python3 -m py_compile \
            harness/agent_loop/run_synthetic.py \
            harness/agent_loop/run_live_metrics.py \
            harness/agent_loop/profiles.py \
            harness/serve/smoke_openai.py \
            harness/serve/openai_compat.py \
            harness/report/aggregate.py

      - name: Harness metric invariants
        run: |
          python3 - <<'PY'
          from harness.serve.openai_compat import derive_tpot_ms
          from harness.agent_loop import profiles
          from harness.agent_loop.run_live_metrics import _ollama_name_matches

          assert derive_tpot_ms(100.0, 50.0, 1) is None, "single-token TPOT must be None"
          assert derive_tpot_ms(100.0, 50.0, 2) == 50.0
          assert profiles.get("live_plan_exec")["max_tokens"] == 160
          assert "live_coding_tool" in profiles.names()
          assert "run_shell" in profiles.cold_prompt("live_agent_tool_loop")
          assert _ollama_name_matches("granite4.1:8b-ctx8k", "granite4.1:8b-ctx8k:latest")
          assert not _ollama_name_matches("granite4.1:8b", "phi4:14b")
          print("ok")
          PY

      - name: Synthetic agent loop
        run: |
          python3 harness/agent_loop/run_synthetic.py --out results/
          python3 harness/report/aggregate.py --results results/
          test -f results/summary.csv
          ls -la results/

      - name: Kernels CMake skip path (no CUDA)
        run: |
          test -f kernels/README.md
          test -f kernels/CMakeLists.txt
          test -f kernels/src/device_hello.cu
          cmake -S kernels -B build/kernels-cpu -DBKL_ENABLE_CUDA=OFF
          # No GPU targets required; configure must succeed without nvcc.
