# GPU CI — self-hosted runner on ShipOfTheseus (RTX 5080).
# CPU-only jobs stay on ubuntu-latest (ci-cpu.yml).
#
# Security: fork PRs never schedule self-hosted jobs (trust gate on GitHub-hosted).
# Prefer main + workflow_dispatch + same-repo PRs only on the GPU host.
name: ci-gpu

on:
  push:
    branches: [main]
    # Docs-only cuts do not need the GPU host (PR #48 failed this job on
    # occupancy while changing only markdown). workflow_dispatch still runs.
    paths-ignore:
      - "**/*.md"
      - LICENSE
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - LICENSE

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate runs on GitHub-hosted only — never execute untrusted fork PR code on GPU host.
  gate:
    name: Trust gate
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.check.outputs.allow }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR — skip self-hosted GPU"
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

  gpu-kernels:
    name: Host GPU probe + kernel smoke
    needs: gate
    if: needs.gate.outputs.allow == 'true'
    # Labels on registered runner ShipOfTheseus (see docs/CI.md).
    runs-on: [self-hosted, Linux, X64, CUDA]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Self-hosted: do not leave GITHUB_TOKEN in git config for later steps.
          persist-credentials: false

      - name: GPU presence
        run: |
          # Serialize with train / desktop occupancy: wait for ≥2 GiB free
          # (HOST_BASELINE) instead of failing the PR in one probe. Budget:
          # up to 10 minutes here, remainder of the 30-minute job for smoke.
          # See kernels/tools/wait_gpu_headroom.sh and docs/CI.md.
          bash kernels/tools/wait_gpu_headroom.sh 2048 600 30
          command -v nvcc && nvcc --version | tail -2 || echo "nvcc not on PATH; kernel build requires it"

      - name: sm_120 kernel suite
        run: |
          # kernels/CMakeLists.txt locates nvcc and a supported host compiler
          # (g++-15 … g++-6), and fails with install instructions when neither
          # is present. This is deliberately the same flag-free invocation the
          # README and docs/CI.md give users, so CI exercises the documented
          # command rather than a second, narrower copy of the same search.
          cmake -S kernels -B build/kernels -DBKL_ENABLE_CUDA=ON
          cmake --build build/kernels -j"$(nproc 2>/dev/null || echo 4)"
          ./build/kernels/src/bkl_device_hello | tee /tmp/bkl_device_hello.out
          # This lab's self-hosted runner is ShipOfTheseus / RTX 5080 (sm_120).
          grep -Fq "device0: NVIDIA GeForce RTX 5080 compute 12.0" /tmp/bkl_device_hello.out
          grep -q "bkl device_hello sm_120 ok" /tmp/bkl_device_hello.out
          ./build/kernels/src/bkl_graph_launch_bench \
            --out results/graph-launch-bench.json | tee /tmp/bkl_graph_launch_bench.out
          grep -Fq "device0: NVIDIA GeForce RTX 5080 compute 12.0" /tmp/bkl_graph_launch_bench.out
          test -s results/graph-launch-bench.json
          python3 -m json.tool results/graph-launch-bench.json >/dev/null
          grep -q "bkl graph_launch_bench sm_120 ok" /tmp/bkl_graph_launch_bench.out
          ./build/kernels/src/bkl_green_ctx_bench \
            --out results/green-ctx-bench.json | tee /tmp/bkl_green_ctx_bench.out
          grep -Fq "bkl green_ctx_bench sm_120" /tmp/bkl_green_ctx_bench.out
          grep -Fq "bkl green_ctx_bench sm_120 ok" /tmp/bkl_green_ctx_bench.out
          test -s results/green-ctx-bench.json
          # Recomputes the wave counts and per-invocation improvement from the
          # report's own inputs; see kernels/tools/check_green_ctx_report.py.
          python3 kernels/tools/check_green_ctx_report.py results/green-ctx-bench.json
