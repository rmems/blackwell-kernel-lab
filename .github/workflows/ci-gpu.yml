# GPU CI — self-hosted runner on ShipOfTheseus (RTX 5080).
# CPU-only jobs stay on ubuntu-latest (ci-cpu.yml).
#
# Security: fork PRs never schedule self-hosted jobs (trust gate on GitHub-hosted).
# Prefer main + workflow_dispatch + same-repo PRs only on the GPU host.
name: ci-gpu

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate runs on GitHub-hosted only — never execute untrusted fork PR code on GPU host.
  gate:
    name: Trust gate
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.check.outputs.allow }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR — skip self-hosted GPU"
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

  gpu-kernels:
    name: Host GPU probe + kernel smoke
    needs: gate
    if: needs.gate.outputs.allow == 'true'
    # Labels on registered runner ShipOfTheseus (see docs/CI.md).
    runs-on: [self-hosted, Linux, X64, CUDA]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Self-hosted: do not leave GITHUB_TOKEN in git config for later steps.
          persist-credentials: false

      - name: GPU presence
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free --format=csv
          free_mib="$(nvidia-smi --query-gpu=memory.free --format=csv,noheader,nounits | head -n1 | tr -d '[:space:]')"
          if [ "$free_mib" -lt 2048 ]; then
            echo "Need at least 2048 MiB free on GPU 0; found ${free_mib} MiB"
            exit 1
          fi
          command -v nvcc && nvcc --version | tail -2 || echo "nvcc not on PATH; kernel build requires it"

      - name: sm_120 kernel suite
        run: |
          HOST_CXX=""
          # Prefer newer supported hosts first (CUDA 13.3: g++ 6–15).
          for c in \
            /home/linuxbrew/.linuxbrew/bin/g++-15 \
            /usr/bin/g++-15 \
            /usr/bin/g++-14 \
            /usr/bin/g++-13; do
            if [ -x "$c" ]; then HOST_CXX="$c"; break; fi
          done
          CMAKE_ARGS=(-S kernels -B build/kernels -DBKL_ENABLE_CUDA=ON)
          if [ -n "$HOST_CXX" ]; then
            CMAKE_ARGS+=(-DBKL_CUDA_HOST_COMPILER="$HOST_CXX")
          fi
          if [ -x /usr/local/cuda/bin/nvcc ]; then
            CMAKE_ARGS+=(-DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc)
          fi
          if [ -z "$HOST_CXX" ]; then
            echo "Need g++-15/14/13 for CUDA 13.3 host compiler (see kernels/README.md)"
            exit 1
          fi
          cmake "${CMAKE_ARGS[@]}"
          cmake --build build/kernels -j"$(nproc 2>/dev/null || echo 4)"
          ./build/kernels/src/bkl_device_hello | tee /tmp/bkl_device_hello.out
          # This lab's self-hosted runner is ShipOfTheseus / RTX 5080 (sm_120).
          grep -Fq "device0: NVIDIA GeForce RTX 5080 compute 12.0" /tmp/bkl_device_hello.out
          grep -q "bkl device_hello sm_120 ok" /tmp/bkl_device_hello.out
          ./build/kernels/src/bkl_graph_launch_bench \
            --out results/graph-launch-bench.json | tee /tmp/bkl_graph_launch_bench.out
          grep -Fq "device0: NVIDIA GeForce RTX 5080 compute 12.0" /tmp/bkl_graph_launch_bench.out
          test -s results/graph-launch-bench.json
          python3 -m json.tool results/graph-launch-bench.json >/dev/null
          grep -q "bkl graph_launch_bench sm_120 ok" /tmp/bkl_graph_launch_bench.out
          ./build/kernels/src/bkl_green_ctx_bench \
            --out results/green-ctx-bench.json | tee /tmp/bkl_green_ctx_bench.out
          grep -Fq "bkl green_ctx_bench sm_120" /tmp/bkl_green_ctx_bench.out
          grep -Fq "bkl green_ctx_bench sm_120 ok" /tmp/bkl_green_ctx_bench.out
          test -s results/green-ctx-bench.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("results/green-ctx-bench.json").read_text())
          assert data["schema"] == "bkl.green_ctx_bench.v1"
          assert data["host"]["compute_capability"] == "12.0"
          assert data["outcome"] in {
              "compile_time_api_unavailable",
              "unsupported",
              "not_permitted",
              "no_legal_split",
              "insufficient_vram_headroom",
              "measured",
          }
          if data["outcome"] == "measured":
              assert data["measurement_skipped_reason"] is None
              assert data["host"]["projected_free_after_bytes"] >= data["host"]["required_headroom_bytes"]
              assert data["host"]["vram_min_observed_bytes"] >= data["host"]["required_headroom_bytes"]
              assert data["capability"]["created_groups"] == 2
              assert data["summary"]["ordinary_median_ms"] > 0
              assert data["summary"]["partitioned_median_ms"] > 0
              assert len(data["invocations"]) == 3
              required_improvement = data["decision"]["required_improvement_percent"]
              recomputed_gates = []
              for invocation in data["invocations"]:
                  assert invocation["correctness"] is True
                  assert len(invocation["ordinary_gpu_latency_ms"]) == 7
                  assert len(invocation["partitioned_gpu_latency_ms"]) == 7
                  recomputed_improvement = 100.0 * (
                      invocation["ordinary_median_ms"]
                      - invocation["partitioned_median_ms"]
                  ) / invocation["ordinary_median_ms"]
                  recomputed_gate = recomputed_improvement >= required_improvement
                  assert invocation["gate_pass"] is recomputed_gate
                  recomputed_gates.append(recomputed_gate)
              passed_all_three = all(recomputed_gates)
              assert data["decision"]["passed_all_three"] is passed_all_three
              assert data["decision"]["follow_up_justified"] is passed_all_three
          else:
              assert data["measurement_skipped_reason"]
              assert data["invocations"] == []
              assert data["summary"]["ordinary_median_ms"] is None
              assert data["summary"]["partitioned_median_ms"] is None
              assert data["summary"]["improvement_percent"] is None
              assert data["decision"]["passed_all_three"] is None
          PY
