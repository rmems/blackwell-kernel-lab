# GPU CI — self-hosted runner on ShipOfTheseus (RTX 5080).
# CPU-only jobs stay on ubuntu-latest (ci-cpu.yml).
#
# Security: fork PRs never schedule self-hosted jobs (trust gate on GitHub-hosted).
# Prefer main + workflow_dispatch + same-repo PRs only on the GPU host.
name: ci-gpu

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate runs on GitHub-hosted only — never execute untrusted fork PR code on GPU host.
  gate:
    name: Trust gate
    runs-on: ubuntu-latest
    outputs:
      allow: ${{ steps.check.outputs.allow }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR — skip self-hosted GPU"
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

  gpu-smoke:
    name: Host GPU probe + synthetic
    needs: gate
    if: needs.gate.outputs.allow == 'true'
    # Labels on registered runner ShipOfTheseus (see docs/CI.md).
    runs-on: [self-hosted, Linux, X64, CUDA]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Self-hosted: do not leave GITHUB_TOKEN in git config for later steps.
          persist-credentials: false

      - name: GPU presence
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total,memory.free --format=csv
          command -v nvcc && nvcc --version | tail -2 || echo "nvcc not on PATH (ok for harness-only)"

      - name: Compile harness
        run: |
          python3 -m py_compile \
            harness/agent_loop/run_synthetic.py \
            harness/agent_loop/run_live_metrics.py \
            harness/agent_loop/profiles.py \
            harness/serve/smoke_openai.py \
            harness/serve/openai_compat.py \
            harness/report/aggregate.py

      - name: Synthetic harness (no model)
        run: |
          python3 harness/agent_loop/run_synthetic.py --out results/
          python3 harness/report/aggregate.py --results results/

      - name: L3 device_hello (sm_120)
        run: |
          HOST_CXX=""
          # Prefer newer supported hosts first (CUDA 13.3: g++ 6–15).
          for c in \
            /home/linuxbrew/.linuxbrew/bin/g++-15 \
            /usr/bin/g++-15 \
            /usr/bin/g++-14 \
            /usr/bin/g++-13; do
            if [ -x "$c" ]; then HOST_CXX="$c"; break; fi
          done
          CMAKE_ARGS=(-S kernels -B build/kernels -DBKL_ENABLE_CUDA=ON)
          if [ -n "$HOST_CXX" ]; then
            CMAKE_ARGS+=(-DBKL_CUDA_HOST_COMPILER="$HOST_CXX")
          fi
          if [ -x /usr/local/cuda/bin/nvcc ]; then
            CMAKE_ARGS+=(-DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc)
          fi
          if [ -z "$HOST_CXX" ]; then
            echo "Need g++-15/14/13 for CUDA 13.3 host compiler (see kernels/README.md)"
            exit 1
          fi
          cmake "${CMAKE_ARGS[@]}"
          cmake --build build/kernels -j"$(nproc 2>/dev/null || echo 4)"
          ./build/kernels/src/bkl_device_hello | tee /tmp/bkl_device_hello.out
          # This lab's self-hosted runner is ShipOfTheseus / RTX 5080 (sm_120).
          grep -Fq "device0: NVIDIA GeForce RTX 5080 compute 12.0" /tmp/bkl_device_hello.out
          grep -q "bkl device_hello sm_120 ok" /tmp/bkl_device_hello.out

      - name: Live engine smoke (optional)
        if: ${{ vars.BKL_GPU_LIVE_SMOKE == '1' }}
        env:
          BKL_BASE_URL: http://127.0.0.1:11434/v1
          BKL_MODEL: granite4.1:8b
        run: |
          python3 harness/serve/smoke_openai.py --out results/ --stream --label ci-gpu-smoke \
            --skip-content-slo || echo "::warning::live smoke failed (engine down?)"
